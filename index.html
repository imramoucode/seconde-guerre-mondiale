<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Seconde Guerre mondiale</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
    color:#fff;
    line-height:1.8;
}

/* ===== MESSAGE ===== */

#hint{
    position:fixed;
    top:90px;
    left:50%;
    transform:translateX(-50%);
    background:linear-gradient(45deg,#ff9800,#ff5722);
    color:white;
    padding:12px 22px;
    border-radius:15px;
    font-weight:600;
    z-index:3000;
    box-shadow:0 5px 20px rgba(0,0,0,.3);
    animation:float 2s ease-in-out infinite;
}

/* ===== MENU ===== */

nav{
    position:fixed;
    top:0;
    width:100%;
    z-index:2000;

    background:rgba(13,27,42,.75);
    backdrop-filter:blur(12px);

    box-shadow:0 4px 25px rgba(0,0,0,.3);
}

nav ul{
    list-style:none;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
    padding:18px;
}

nav a{
    color:white;
    text-decoration:none;
    padding:10px 16px;
    border-radius:10px;
    transition:.3s;
    font-weight:600;
    position:relative;
}

nav a:hover{
    background:#4da3ff;
    transform:translateY(-3px);
}

nav a::after{
    content:"";
    position:absolute;
    bottom:0;
    left:50%;
    width:0%;
    height:3px;
    background:white;
    transition:.3s;
    transform:translateX(-50%);
}

nav a:hover::after{
    width:80%;
}

/* ===== CONTENU ===== */

main{
    max-width:1100px;
    margin:140px auto 50px auto;
    padding:25px;
}

h1{
    text-align:center;
    font-size:3rem;
    margin-bottom:50px;

    background:linear-gradient(45deg,#4da3ff,#00e5ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:fadeUp 1s ease;
}

h2{
    margin-top:60px;
    margin-bottom:20px;
    color:#4ade80;
    border-left:6px solid #4ade80;
    padding-left:15px;

    transition:.3s;
}

h2:hover{
    transform:translateX(10px);
}

h3{
    color:#fbbf24;
    margin-top:30px;
    margin-bottom:15px;
}

p,
ul{
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(8px);

    padding:20px;
    border-radius:18px;

    margin-bottom:20px;

    box-shadow:0 5px 20px rgba(0,0,0,.2);

    transition:.35s;
}

p:hover,
ul:hover{
    transform:translateY(-6px);
    box-shadow:0 12px 30px rgba(0,0,0,.35);
}

ul{
    padding-left:45px;
}

img{
    display:block;
    width:85%;
    max-width:750px;
    margin:30px auto;

    border-radius:18px;

    transition:.5s;

    box-shadow:0 10px 25px rgba(0,0,0,.4);
}

img:hover{
    transform:scale(1.04);
}

iframe{
    display:block;
    margin:40px auto;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,.4);
}

/* ===== ANIMATIONS ===== */

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes float{
    0%,100%{
        transform:translateX(-50%) translateY(0);
    }
    50%{
        transform:translateX(-50%) translateY(-8px);
    }
}

/* ===== RESPONSIVE ===== */

@media(max-width:768px){

    h1{
        font-size:2rem;
    }

    nav ul{
        gap:8px;
    }

    nav a{
        font-size:13px;
        padding:8px 10px;
    }

    main{
        margin-top:180px;
    }
}

</style>
</head>
